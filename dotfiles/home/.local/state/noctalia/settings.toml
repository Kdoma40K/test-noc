config_version = 20

[dock]
background_opacity = 0.95999997854232788
icon_saturation = 0.84999998100101948

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 720.0
    cy = 778.0
    output = "eDP-1"
    placement_height = 960.0
    placement_width = 1440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_media_controls = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "kenn/keybind-cheatsheet" ]

    [[plugins.source]]
    kind = "path"
    location = "~/test-noc/plugins"
    name = "kunu-dev"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
telemetry_enabled = true

[theme]
shell_mode = "dark"
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "hyprland", "kitty", "qt" ]
    community_ids = [ "claude-code", "zen-browser" ]

[wallpaper.default]
path = "/home/kdoma/Pictures/Wallpapers/plane.jpg"

[wallpaper.last]
path = "/home/kdoma/Pictures/Wallpapers/plane.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/kdoma/Pictures/Wallpapers/plane.jpg"