# kitty, from the NUC's config, adapted for tinyputy.
# Colors: Noctalia's kitty template rewrites themes/noctalia.conf (included at the end).

# Font
# Same font as the NUC (ttf-jetbrains-mono-nerd); icons for prompts and tools
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
# NUC: 14 (on its 4K screen); 11 matches Noctalia's text on this 2x laptop panel
font_size 11.0
disable_ligatures cursor

# Cursor
cursor_shape beam
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_blink_interval 0.5

# Padding (why weird value? consistency with foot)
window_margin_width 21.75

# See-through background: Hyprland blurs the wallpaper behind it (frost, xray)
background_opacity 0.55
dynamic_background_opacity yes
# ctrl+shift+a then m / l to raise / lower opacity live

# Window
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes

# Tabs
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_title_template "{index}: {title}"

# Scrollback and links
scrollback_lines 10000
scrollback_pager_history_size 64
url_style curly
detect_urls yes
underline_hyperlinks always
copy_on_select clipboard
strip_trailing_spaces smart

# Use fish shell
shell fish

# Performance (smooth on the 120 Hz panel)
repaint_delay 8
input_delay 2
sync_to_monitor yes

# Copy / paste
map ctrl+c         copy_or_interrupt
map ctrl+v         paste_from_clipboard

# Search (kitty's built-in scrollback search; the NUC's search.py kitten isn't on this laptop)
map ctrl+f        show_scrollback
map kitty_mod+f   show_scrollback

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0

# Splits and tabs
map kitty_mod+enter  launch --cwd=current --location=vsplit
map kitty_mod+t      new_tab_with_cwd
map kitty_mod+r      load_config_file

include themes/noctalia.conf
