# foot config for the NASA-punk theme. Copy to ~/.config/foot/foot.ini.
# Colors come from Noctalia's foot template ([theme.templates] builtin_ids = ["foot"]),
# which rewrites ~/.config/foot/themes/noctalia whenever the palette changes.
include=~/.config/foot/themes/noctalia

# JetBrains Mono for long terminal work; Departure Mono (the retro pixel face) stays in the shell.
# Pixel size because foot's point sizes assume 96 dpi; 24 px reads like ~11 pt on a 27" 4K at scale 1.
font=JetBrains Mono:pixelsize=24
font-bold=JetBrains Mono:style=Bold:pixelsize=24
pad=20x16

[colors-dark]
# soft: Hyprland blurs what shows through (theme/hypr/noctalia-blur.lua)
alpha=0.90
