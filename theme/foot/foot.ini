# foot config for the NASA-punk theme. Copy to ~/.config/foot/foot.ini.
# Colors come from Noctalia's foot template ([theme.templates] builtin_ids = ["foot"]),
# which rewrites ~/.config/foot/themes/noctalia whenever the palette changes.
include=~/.config/foot/themes/noctalia

# Departure Mono is a pixel font drawn on an 11 px grid: keep pixelsize a multiple of 11
# (11 at 1080p, 22 at 4K with scale 1) or the pixels smear.
font=Departure Mono:pixelsize=22
pad=20x16

[colors-dark]
alpha=1.0
